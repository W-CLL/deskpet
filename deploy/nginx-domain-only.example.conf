# Install the HTTP block once as the default port-80 server. It redirects
# direct-address and plain-HTTP requests to the canonical HTTPS domain.
server {
    listen 80 default_server;
    server_name _;
    return 308 https://in.desktoppet.online$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name in.desktoppet.online;

    ssl_certificate /www/server/panel/vhost/cert/deskpet/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/deskpet/privkey.pem;

    client_max_body_size 300m;
    proxy_request_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host in.desktoppet.online;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Scheme https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
