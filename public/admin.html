<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>桌搭子更新中心</title>
  <link rel="icon" href="/assets/app-icon.png">
  <link rel="stylesheet" href="/assets/admin.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <img src="/assets/app-icon.png" width="38" height="38" alt="">
      <div>
        <strong>桌搭子更新中心</strong>
        <span id="connectionStatus">受限管理入口</span>
      </div>
    </div>
    <button id="logoutButton" class="button button-quiet" type="button" hidden>退出登录</button>
  </header>

  <main>
    <section id="loginView" class="login-view">
      <form id="loginForm" class="login-panel">
        <div class="section-heading">
          <p class="eyebrow">管理员</p>
          <h1>登录更新中心</h1>
        </div>
        <label>
          <span>用户名</span>
          <input name="username" autocomplete="username" value="admin" required>
        </label>
        <label>
          <span>密码</span>
          <input name="password" type="password" autocomplete="current-password" required autofocus>
        </label>
        <p id="loginError" class="form-error" role="alert"></p>
        <button class="button button-primary button-block" type="submit">登录</button>
      </form>
    </section>

    <div id="adminView" hidden>
      <section class="summary-band">
        <div class="summary-item">
          <span>当前发布</span>
          <strong id="activeVersion">尚未发布</strong>
        </div>
        <div class="manifest-field">
          <label for="manifestUrl">更新清单地址</label>
          <div class="copy-row">
            <input id="manifestUrl" readonly>
            <button id="copyManifestButton" class="button button-secondary" type="button">复制地址</button>
          </div>
        </div>
      </section>

      <section class="workspace-section upload-section">
        <div class="section-heading">
          <p class="eyebrow">新版本</p>
          <h1>上传安装包</h1>
        </div>
        <form id="uploadForm" class="upload-form">
          <label>
            <span>版本号</span>
            <input id="releaseVersion" name="version" inputmode="decimal" placeholder="1.6.0" pattern="\d+(\.\d+){1,3}(-[0-9A-Za-z.-]+)?" required>
          </label>
          <label class="file-field">
            <span>Windows 安装包</span>
            <input id="releaseFile" name="file" type="file" accept=".exe,application/octet-stream" required>
          </label>
          <label class="notes-field">
            <span>更新说明</span>
            <textarea id="releaseNotes" name="notes" rows="4" maxlength="1200" placeholder="每行一项"></textarea>
          </label>
          <div class="upload-actions">
            <div id="uploadProgress" class="progress-wrap" hidden>
              <progress id="uploadProgressBar" max="100" value="0"></progress>
              <span id="uploadProgressText">0%</span>
            </div>
            <button id="uploadButton" class="button button-primary" type="submit">上传为草稿</button>
          </div>
        </form>
      </section>

      <section class="workspace-section activation-section">
        <div class="section-heading inline-heading">
          <div>
            <p class="eyebrow">设备授权</p>
            <h1>激活码管理</h1>
          </div>
          <button id="refreshActivationButton" class="button button-secondary" type="button">刷新</button>
        </div>
        <div class="activation-summary" aria-label="激活码统计">
          <span>全部 <strong id="activationTotal">0</strong></span>
          <span>未使用 <strong id="activationUnused">0</strong></span>
          <span>有效授权 <strong id="activationActive">0</strong></span>
          <span>已撤销 <strong id="activationRevoked">0</strong></span>
        </div>
        <form id="generateCodeForm" class="activation-form">
          <label>
            <span>生成数量</span>
            <input id="activationCount" name="count" type="number" min="1" max="100" value="1" required>
          </label>
          <label>
            <span>未使用有效期（天）</span>
            <input id="activationExpiry" name="expiresInDays" type="number" min="1" max="365" value="30" required>
          </label>
          <label class="activation-note-field">
            <span>备注</span>
            <input id="activationNote" name="note" maxlength="120" placeholder="例如：测试设备或发放批次">
          </label>
          <button id="generateCodeButton" class="button button-primary" type="submit">生成激活码</button>
        </form>
        <div class="table-wrap activation-table-wrap">
          <table class="activation-table">
            <thead>
              <tr>
                <th>激活码</th>
                <th>状态</th>
                <th>备注</th>
                <th>生成与有效期</th>
                <th>设备授权</th>
                <th class="actions-column">操作</th>
              </tr>
            </thead>
            <tbody id="activationRows"></tbody>
          </table>
          <p id="emptyActivations" class="empty-state" hidden>暂无激活码</p>
        </div>
      </section>

      <section class="workspace-section releases-section">
        <div class="section-heading inline-heading">
          <div>
            <p class="eyebrow">版本记录</p>
            <h1>发布管理</h1>
          </div>
          <button id="refreshButton" class="button button-secondary" type="button">刷新</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>版本</th>
                <th>状态</th>
                <th>文件</th>
                <th>SHA-256</th>
                <th>创建时间</th>
                <th class="actions-column">操作</th>
              </tr>
            </thead>
            <tbody id="releaseRows"></tbody>
          </table>
          <p id="emptyReleases" class="empty-state" hidden>暂无版本</p>
        </div>
      </section>
    </div>
  </main>

  <dialog id="confirmDialog">
    <form method="dialog">
      <h2 id="confirmTitle">确认操作</h2>
      <p id="confirmMessage"></p>
      <div class="dialog-actions">
        <button class="button button-secondary" value="cancel">取消</button>
        <button id="confirmButton" class="button button-primary" value="confirm">确认</button>
      </div>
    </form>
  </dialog>

  <dialog id="generatedCodesDialog" class="codes-dialog">
    <form method="dialog">
      <h2>激活码已生成</h2>
      <p>完整激活码也可以稍后在管理列表中查看和复制。</p>
      <textarea id="generatedCodesText" readonly rows="8"></textarea>
      <div class="dialog-actions">
        <button id="copyGeneratedCodesButton" class="button button-secondary" type="button">复制全部</button>
        <button class="button button-primary" value="close">完成</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script src="/assets/admin.js" defer></script>
</body>
</html>
